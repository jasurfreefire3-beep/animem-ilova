name: Build Animem Uz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./ilova
        run: flutter pub get

      - name: Setup google-services.json and release keystore
        run: |
          mkdir -p ilova/android/app
          mkdir -p ilova/android/app/src/release
          mkdir -p ilova/android/app/src/main
          if [ ! -f "ilova/android/app/google-services.json" ]; then
            echo "Creating ilova/android/app/google-services.json from base64..."
            echo "" | base64 -d > ilova/android/app/google-services.json
          fi
          cp -f ilova/android/app/google-services.json ilova/android/app/src/release/google-services.json
          cp -f ilova/android/app/google-services.json ilova/android/app/src/main/google-services.json
          if [ ! -f "ilova/android/app/release.keystore" ]; then
            echo "Creating ilova/android/app/release.keystore from base64..."
            echo "" | base64 -d > ilova/android/app/release.keystore
          fi
          echo "Successfully verified keystore and config files."

      - name: Build Release APK
        working-directory: ./ilova
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Animem-Uz-Release-APK
          path: ilova/build/app/outputs/flutter-apk/app-release.apk
