name: Build Animem Uz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./ilova
        run: flutter pub get

      - name: Setup google-services.json
        run: |
          mkdir -p ilova/android/app
          mkdir -p ilova/android/app/src/release
          mkdir -p ilova/android/app/src/main
