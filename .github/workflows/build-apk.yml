name: Build Animem Uz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./ilova
        run: flutter pub get

      - name: Setup google-services.json
        run: |
          mkdir -p ilova/android/app
          if [ -f "ilova/android/gradle/google-services.json" ] && [ ! -f "ilova/android/app/google-services.json" ]; then
            cp ilova/android/gradle/google-services.json ilova/android/app/google-services.json
          fi
          if [ -f "google-services.json" ] && [ ! -f "ilova/android/app/google-services.json" ]; then
            cp google-services.json ilova/android/app/google-services.json
          fi
          if [ -f "ilova/android/app/src/release/google-services.json" ] && [ ! -f "ilova/android/app/google-services.json" ]; then
            cp ilova/android/app/src/release/google-services.json ilova/android/app/google-services.json
          fi
          ls -la ilova/android/app/google-services.json

      - name: Build Release APK
        working-directory: ./ilova
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Animem-Uz-Release-APK
          path: ilova/build/app/outputs/flutter-apk/app-release.apk
