name: animem_uz
description: "Animem.uz rasmiy Android ilovasi - Sevimli animelaringizni o'zbek tilida tomosha qiling"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & APIs
  dio: ^5.4.1
  http: ^1.2.0
  socket_io_client: ^2.0.3+1

  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Media & Video Player (HLS, m3u8, mp4, iframe webview)
  video_player: ^2.8.2
  chewie: ^1.7.4
  webview_flutter: ^4.7.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Notifications
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1

  # UI & Animations
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  font_awesome_flutter: ^10.7.0

  # URL Launcher (Telegram bot ochish uchun)
  url_launcher: ^6.2.5

  # Auth & Utilities
  google_sign_in: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
